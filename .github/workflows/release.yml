name: Release Character Packages

on:
  push:
    branches:
      - main  # push 到 main 分支时触发
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-game:
    name: 打包（按游戏分类）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pypinyin
        run: pip install pypinyin

      - name: Create game zip packages
        run: |
          mkdir -p release_packages name_mapping
          for game_dir in Characters/*/; do
            if [ -d "$game_dir" ]; then
              game_name=$(basename "$game_dir")
              zip_filename=$(python3 .github/scripts/to_camel.py "$game_name")
              zip_path="release_packages/$zip_filename.zip"
              echo "$game_name" > "name_mapping/$zip_filename.txt"
              cd Characters
              zip -r "../$zip_path" "$game_name/"
              cd ..
              echo "Created game pack: $zip_filename.zip"
            fi
          done

      - name: Upload game artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-packages
          path: |
            release_packages/*.zip
            name_mapping/*.txt
          if-no-files-found: error

  build-single:
    name: 打包（按角色分类）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pypinyin
        run: pip install pypinyin

      - name: Find character directories
        id: find_characters
        run: |
          CHARACTER_LIST=""
          for game_dir in Characters/*/; do
            if [ -d "$game_dir" ]; then
              for char_dir in "$game_dir"*/; do
                if [ -d "$char_dir" ] && [ -f "$char_dir/Profile.json" ]; then
                  char_name=$(basename "$char_dir")
                  if [ -n "$CHARACTER_LIST" ]; then
                    CHARACTER_LIST="$CHARACTER_LIST|$char_dir"
                  else
                    CHARACTER_LIST="$char_dir"
                  fi
                fi
              done
            fi
          done
          echo "characters=$CHARACTER_LIST" >> $GITHUB_OUTPUT

      - name: Create single zip packages
        run: |
          mkdir -p release_packages name_mapping
          IFS='|' read -ra CHAR_DIRS <<< "${{ steps.find_characters.outputs.characters }}"
          for char_dir in "${CHAR_DIRS[@]}"; do
            if [ -d "$char_dir" ]; then
              char_name=$(basename "$char_dir")
              zip_filename=$(python3 .github/scripts/to_camel.py "$char_name")
              zip_path="release_packages/$zip_filename.zip"
              echo "$char_name" > "name_mapping/$zip_filename.txt"
              cd "$(dirname "$char_dir")"
              zip -r "../../$zip_path" "$char_name/"
              cd - > /dev/null
              echo "Created single pack: $zip_filename.zip"
            fi
          done

      - name: Upload single artifacts
        uses: actions/upload-artifact@v4
        with:
          name: single-packages
          path: |
            release_packages/*.zip
            name_mapping/*.txt
          if-no-files-found: error

  release-game:
    name: 发布游戏分类 Release（V1.0.0）
    needs: build-game
    runs-on: ubuntu-latest
    steps:
      - name: Download game artifacts
        uses: actions/download-artifact@v4
        with:
          name: game-packages
          path: packages

      - name: Move files
        run: |
          mkdir -p release_packages name_mapping
          mv packages/release_packages/*.zip release_packages/ 2>/dev/null || true
          mv packages/name_mapping/*.txt name_mapping/ 2>/dev/null || true

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          # 游戏分类角色包
          
          按游戏分类的角色包，每个 zip 包含该游戏下的所有角色。
          
          ## 角色包列表
          EOF
          for zip_file in release_packages/*.zip; do
            if [ -f "$zip_file" ]; then
              filename=$(basename "$zip_file" .zip)
              if [ -f "name_mapping/$filename.txt" ]; then
                chinese_name=$(cat "name_mapping/$filename.txt")
                echo "- **${chinese_name}**" >> release_notes.md
              fi
            fi
          done
          cat >> release_notes.md << 'EOF'
          
          ## 使用方法
          
          1. 下载你想要的角色 zip 文件
          2. 在 App 中进入 **【我】→ 导入角色包**
          3. 选择下载的 zip 文件并勾选要导入的角色
          
          ## 注意事项
          
          - 文本文件建议使用 UTF-8 编码
          - zip 中必须包含至少一个带 Profile.json 的角色文件夹
          - 文件层级不要过深
          EOF

      - name: Delete existing release V1.0.0
        run: |
          gh release delete "V1.0.0" --yes --cleanup-tag -R "${{ github.repository }}" 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs/tags/V1.0.0" -X DELETE 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release V1.0.0
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.0.0
          name: 游戏分类角色包 V1.0.0
          body_path: release_notes.md
          files: release_packages/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets before renaming
        run: |
          echo "=== All Release Assets ==="
          gh api "repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}/assets" \
            --jq '.[] | {name, id}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Rename release assets to Chinese
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.id }}
          RENAMED=0
          SKIPPED=0
          
          # Create lookup map from name_mapping files
          declare -A CHAR_MAP
          while IFS= read -r -d '' txt_file; do
            ascii_name=$(basename "$txt_file" .txt)
            chinese_name=$(tr -d '\n\r' < "$txt_file")
            CHAR_MAP["$ascii_name"]="$chinese_name"
          done < <(find name_mapping -name "*.txt" -print0)
          
          # Process each zip file
          for zip_file in release_packages/*.zip; do
            if [ -f "$zip_file" ]; then
              ascii_name=$(basename "$zip_file" .zip)
              if [ -n "${CHAR_MAP[$ascii_name]+_}" ]; then
                chinese_name="${CHAR_MAP[$ascii_name]}"
                if [ -n "$chinese_name" ] && [ "$chinese_name" != "$ascii_name" ]; then
                  echo "Renaming: $ascii_name.zip -> $chinese_name.zip"
                  
                  # Get all assets and find matching one by iterating
                  FOUND=false
                  while IFS='|' read -r asset_name asset_id; do
                    if [ "$asset_name" = "$ascii_name.zip" ]; then
                      FOUND=true
                      echo "Found asset ID: $asset_id for $ascii_name.zip"
                      response=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
                          "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id" \
                          -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github.v3+json" \
                          -d '{"name": "$chinese_name.zip", "label": "$chinese_name"}')
                      if [ "$response" = "200" ] || [ "$response" = "201" ]; then
                        echo "\u2713 Renamed: $chinese_name.zip"
                        ((RENAMED++))
                      else
                        echo "\u26a0 Failed to rename: $ascii_name.zip"
                        ((SKIPPED++))
                      fi
                      break
                    fi
                  done < <(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
                    --jq '.[] | [.name, (.id | tostring)] | join("|")')
                  
                  if [ "$FOUND" = false ]; then
                    echo "\u26a0 Asset not found: $ascii_name.zip"
                    ((SKIPPED++))
                  fi
                else
                  echo "SKIP: Already correct for $ascii_name"
                fi
              else
                echo "\u26a0 No mapping found: $ascii_name.zip"
                ((SKIPPED++))
              fi
            fi
          done
          
          echo ""
          echo "=== Summary ==="
          echo "Renamed: $RENAMED"
          echo "Skipped: $SKIPPED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-single:
    name: 发布角色分类 Release（V1.1.0）
    needs: build-single
    runs-on: ubuntu-latest
    steps:
      - name: Download single artifacts
        uses: actions/download-artifact@v4
        with:
          name: single-packages
          path: packages

      - name: Move files
        run: |
          mkdir -p release_packages name_mapping
          mv packages/release_packages/*.zip release_packages/ 2>/dev/null || true
          mv packages/name_mapping/*.txt name_mapping/ 2>/dev/null || true

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          # 角色分类角色包
          
          按角色分类的角色包，每个 zip 包含一个角色。
          
          ## 角色包列表
          EOF
          for zip_file in release_packages/*.zip; do
            if [ -f "$zip_file" ]; then
              filename=$(basename "$zip_file" .zip)
              if [ -f "name_mapping/$filename.txt" ]; then
                chinese_name=$(cat "name_mapping/$filename.txt")
                echo "- **${chinese_name}**" >> release_notes.md
              fi
            fi
          done
          cat >> release_notes.md << 'EOF'
          
          ## 使用方法
          
          1. 下载你想要的角色 zip 文件
          2. 在 App 中进入 **【我】→ 导入角色包**
          3. 选择下载的 zip 文件并勾选要导入的角色
          
          ## 注意事项
          
          - 文本文件建议使用 UTF-8 编码
          - zip 中必须包含至少一个带 Profile.json 的角色文件夹
          - 文件层级不要过深
          EOF

      - name: Delete existing release V1.1.0
        run: |
          gh release delete "V1.1.0" --yes --cleanup-tag -R "${{ github.repository }}" 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs/tags/V1.1.0" -X DELETE 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release V1.1.0
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.1.0
          name: 角色分类角色包 V1.1.0
          body_path: release_notes.md
          files: release_packages/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets before renaming
        run: |
          echo "=== All Release Assets ==="
          gh api "repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}/assets" \
            --jq '.[] | {name, id}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Rename release assets to Chinese
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.id }}
          RENAMED=0
          SKIPPED=0
          
          # Create lookup map from name_mapping files
          declare -A CHAR_MAP
          while IFS= read -r -d '' txt_file; do
            ascii_name=$(basename "$txt_file" .txt)
            chinese_name=$(tr -d '\n\r' < "$txt_file")
            CHAR_MAP["$ascii_name"]="$chinese_name"
          done < <(find name_mapping -name "*.txt" -print0)
          
          # Process each zip file
          for zip_file in release_packages/*.zip; do
            if [ -f "$zip_file" ]; then
              ascii_name=$(basename "$zip_file" .zip)
              if [ -n "${CHAR_MAP[$ascii_name]+_}" ]; then
                chinese_name="${CHAR_MAP[$ascii_name]}"
                if [ -n "$chinese_name" ] && [ "$chinese_name" != "$ascii_name" ]; then
                  echo "Renaming: $ascii_name.zip -> $chinese_name.zip"
                  
                  # Get all assets and find matching one by iterating
                  FOUND=false
                  while IFS='|' read -r asset_name asset_id; do
                    if [ "$asset_name" = "$ascii_name.zip" ]; then
                      FOUND=true
                      echo "Found asset ID: $asset_id for $ascii_name.zip"
                      response=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
                          "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id" \
                          -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github.v3+json" \
                          -d '{"name": "$chinese_name.zip", "label": "$chinese_name"}')
                      if [ "$response" = "200" ] || [ "$response" = "201" ]; then
                        echo "\u2713 Renamed: $chinese_name.zip"
                        ((RENAMED++))
                      else
                        echo "\u26a0 Failed to rename: $ascii_name.zip"
                        ((SKIPPED++))
                      fi
                      break
                    fi
                  done < <(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
                    --jq '.[] | [.name, (.id | tostring)] | join("|")')
                  
                  if [ "$FOUND" = false ]; then
                    echo "\u26a0 Asset not found: $ascii_name.zip"
                    ((SKIPPED++))
                  fi
                else
                  echo "SKIP: Already correct for $ascii_name"
                fi
              else
                echo "\u26a0 No mapping found: $ascii_name.zip"
                ((SKIPPED++))
              fi
            fi
          done
          
          echo ""
          echo "=== Summary ==="
          echo "Renamed: $RENAMED"
          echo "Skipped: $SKIPPED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
