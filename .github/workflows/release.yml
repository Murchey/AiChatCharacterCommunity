name: Release Character Packages

on:
  push:
    branches:
      - main  # push 到 main 分支时触发
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-game:
    name: 打包（按游戏分类）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pypinyin
        run: pip install pypinyin

      - name: Create game zip packages
        run: |
          mkdir -p release_packages name_mapping
          for game_dir in Characters/*/; do
            if [ -d "$game_dir" ]; then
              game_name=$(basename "$game_dir")
              zip_filename=$(python3 .github/scripts/to_camel.py "$game_name")
              zip_path="release_packages/$zip_filename.zip"
              echo "$game_name" > "name_mapping/$zip_filename.txt"
              cd Characters
              zip -r "../$zip_path" "$game_name/"
              cd ..
              echo "Created game pack: $zip_filename.zip"
            fi
          done

      - name: Upload game artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-packages
          path: |
            release_packages/*.zip
            name_mapping/*.txt
          if-no-files-found: error

  build-single:
    name: 打包（按角色分类）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pypinyin
        run: pip install pypinyin

      - name: Find character directories
        id: find_characters
        run: |
          CHARACTER_LIST=""
          for game_dir in Characters/*/; do
            if [ -d "$game_dir" ]; then
              for char_dir in "$game_dir"*/; do
                if [ -d "$char_dir" ] && [ -f "$char_dir/Profile.json" ]; then
                  char_name=$(basename "$char_dir")
                  if [ -n "$CHARACTER_LIST" ]; then
                    CHARACTER_LIST="$CHARACTER_LIST|$char_dir"
                  else
                    CHARACTER_LIST="$char_dir"
                  fi
                fi
              done
            fi
          done
          echo "characters=$CHARACTER_LIST" >> $GITHUB_OUTPUT

      - name: Create single zip packages
        run: |
          mkdir -p release_packages name_mapping
          IFS='|' read -ra CHAR_DIRS <<< "${{ steps.find_characters.outputs.characters }}"
          for char_dir in "${CHAR_DIRS[@]}"; do
            if [ -d "$char_dir" ]; then
              char_name=$(basename "$char_dir")
              # Use Chinese name directly as the zip filename (UTF-8 supported)
              zip_path="release_packages/$char_name.zip"
              # Store ASCII mapping for reference (keyed by ascii name)
              ascii_name=$(python3 .github/scripts/to_camel.py "$char_name")
              echo "$ascii_name" > "name_mapping/$ascii_name.txt"
              cd "$(dirname "$char_dir")"
              zip -r "../../$zip_path" "$char_name/"
              cd - > /dev/null
              echo "Created single pack: $char_name.zip"
            fi
          done

      - name: Upload single artifacts
        uses: actions/upload-artifact@v4
        with:
          name: single-packages
          path: |
            release_packages/*.zip
            name_mapping/*.txt
          if-no-files-found: error

  build-stickers:
    name: 打包（表情包分类）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create sticker zip packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_packages
          package_count=0

          for sticker_dir in Stickers/*/; do
            [ -d "$sticker_dir" ] || continue

            sticker_name=$(basename "$sticker_dir")
            if ! find "$sticker_dir" -type f \( \
              -iname '*.gif' -o -iname '*.webp' -o -iname '*.png' -o \
              -iname '*.jpg' -o -iname '*.jpeg' \
            \) -print -quit | grep -q .; then
              echo "Skipping $sticker_name: no supported sticker images found."
              continue
            fi

            (
              cd Stickers
              zip -r "../release_packages/$sticker_name.zip" "$sticker_name" \
                -i '*.gif' '*.webp' '*.png' '*.jpg' '*.jpeg' \
                   '*.GIF' '*.WEBP' '*.PNG' '*.JPG' '*.JPEG'
            )
            echo "Created sticker pack: $sticker_name.zip"
            package_count=$((package_count + 1))
          done

          if [ "$package_count" -eq 0 ]; then
            echo "No valid sticker packages were found under Stickers/." >&2
            exit 1
          fi

      - name: Upload sticker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sticker-packages
          path: release_packages/*.zip
          if-no-files-found: error

  release-game:
    name: 发布游戏分类 Release（V1.0.0）
    needs: build-game
    runs-on: ubuntu-latest
    steps:
      - name: Download game artifacts
        uses: actions/download-artifact@v4
        with:
          name: game-packages
          path: packages

      - name: Move files
        run: |
          mkdir -p release_packages name_mapping
          mv packages/release_packages/*.zip release_packages/ 2>/dev/null || true
          mv packages/name_mapping/*.txt name_mapping/ 2>/dev/null || true

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          # 游戏分类角色包
          
          按游戏分类的角色包，每个 zip 包含该游戏下的所有角色。
          
          ## 角色包列表
          EOF
          for zip_file in release_packages/*.zip; do
            if [ -f "$zip_file" ]; then
              filename=$(basename "$zip_file" .zip)
              if [ -f "name_mapping/$filename.txt" ]; then
                chinese_name=$(cat "name_mapping/$filename.txt")
                echo "- **${chinese_name}**" >> release_notes.md
              fi
            fi
          done
          cat >> release_notes.md << 'EOF'
          
          ## 使用方法
          
          1. 下载你想要的角色 zip 文件
          2. 在 App 中进入 **【我】→ 导入角色包**
          3. 选择下载的 zip 文件并勾选要导入的角色
          
          ## 注意事项
          
          - 文本文件建议使用 UTF-8 编码
          - zip 中必须包含至少一个带 Profile.json 的角色文件夹
          - 文件层级不要过深
          EOF

      - name: Delete existing release V1.0.0
        run: |
          gh release delete "V1.0.0" --yes --cleanup-tag -R "${{ github.repository }}" 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs/tags/V1.0.0" -X DELETE 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release V1.0.0
        id: create_release_game
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.0.0
          name: 游戏分类角色包 V1.0.0
          body_path: release_notes.md
          files: release_packages/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-single:
    name: 发布角色分类 Release（V1.1.0）
    needs: build-single
    runs-on: ubuntu-latest
    steps:
      - name: Download single artifacts
        uses: actions/download-artifact@v4
        with:
          name: single-packages
          path: packages

      - name: Move files
        run: |
          mkdir -p release_packages name_mapping
          mv packages/release_packages/*.zip release_packages/ 2>/dev/null || true
          mv packages/name_mapping/*.txt name_mapping/ 2>/dev/null || true

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          # 角色分类角色包
          
          按角色分类的角色包，每个 zip 包含一个角色。
          
          ## 角色包列表
          EOF
          for zip_file in release_packages/*.zip; do
            if [ -f "$zip_file" ]; then
              filename=$(basename "$zip_file" .zip)
              if [ -f "name_mapping/$filename.txt" ]; then
                chinese_name=$(cat "name_mapping/$filename.txt")
                echo "- **${chinese_name}**" >> release_notes.md
              fi
            fi
          done
          cat >> release_notes.md << 'EOF'
          
          ## 使用方法
          
          1. 下载你想要的角色 zip 文件
          2. 在 App 中进入 **【我】→ 导入角色包**
          3. 选择下载的 zip 文件并勾选要导入的角色
          
          ## 注意事项
          
          - 文本文件建议使用 UTF-8 编码
          - zip 中必须包含至少一个带 Profile.json 的角色文件夹
          - 文件层级不要过深
          EOF

      - name: Delete existing release V1.1.0
        run: |
          gh release delete "V1.1.0" --yes --cleanup-tag -R "${{ github.repository }}" 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs/tags/V1.1.0" -X DELETE 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release V1.1.0
        id: create_release_single
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.1.0
          name: 角色分类角色包 V1.1.0
          body_path: release_notes.md
          files: release_packages/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-stickers:
    name: 发布表情包分类 Release（V1.3.0）
    needs: build-stickers
    runs-on: ubuntu-latest
    steps:
      - name: Download sticker artifacts
        uses: actions/download-artifact@v4
        with:
          name: sticker-packages
          path: release_packages

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release_notes.md << 'EOF'
          # 表情包

          下载 ZIP 后，在 App 中进入 **【我】→ 创意工坊 → 表情包分类**，勾选并下载导入。

          ## 表情包列表
          EOF
          for zip_file in release_packages/*.zip; do
            [ -f "$zip_file" ] || continue
            sticker_name=$(basename "$zip_file" .zip)
            echo "- **${sticker_name}**" >> release_notes.md
          done
          cat >> release_notes.md << 'EOF'

          ## 说明

          - 每个 ZIP 是一个独立表情包。
          - ZIP 内图片文件名（去掉扩展名）会作为导入后的表情包备注。
          - 支持 GIF、WebP、PNG、JPG 和 JPEG 图片。
          EOF

      - name: Delete existing release V1.3.0
        run: |
          gh release delete "V1.3.0" --yes --cleanup-tag -R "${{ github.repository }}" 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs/tags/V1.3.0" -X DELETE 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release V1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.3.0
          name: 表情包 V1.3.0
          body_path: release_notes.md
          files: release_packages/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
