name: Build & Release Character Packs

# push 到 main 且 Characters 相关文件变化时自动打包发布；也可手动触发
on:
  push:
    branches: [main]
    paths:
      - 'Characters/**'
      - 'scripts/build-packs.sh'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 两个 release 的固定版本号（覆盖更新同名 release，如需改名/升版本改这里）
  GAME_PACK_VERSION: "1.0.0"
  SINGLE_PACK_VERSION: "1.1.0"

jobs:
  build:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行打包脚本
        run: bash scripts/build-packs.sh

      - name: 上传游戏包产物
        uses: actions/upload-artifact@v4
        with:
          name: game-packs
          path: dist/game/*.zip
          if-no-files-found: error

      - name: 上传角色包产物
        uses: actions/upload-artifact@v4
        with:
          name: single-packs
          path: dist/single/*.zip
          if-no-files-found: error

  release-game:
    name: 发布游戏分类角色包
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载游戏包产物
        uses: actions/download-artifact@v4
        with:
          name: game-packs
          path: packs

      - name: 发布 Release（覆盖更新）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: characters-game
          name: 游戏分类角色包 V${{ env.GAME_PACK_VERSION }}
          body: |
            按游戏分类的角色包，随 Characters 内容更新自动覆盖。

            - 版本: V${{ env.GAME_PACK_VERSION }}
            - 更新 commit: ${{ github.sha }}
            - 更新时间: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          files: packs/*.zip
          overwrite: true

  release-single:
    name: 发布角色分类角色包
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载角色包产物
        uses: actions/download-artifact@v4
        with:
          name: single-packs
          path: packs

      - name: 发布 Release（覆盖更新）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: characters-single
          name: 角色分类角色包 V${{ env.SINGLE_PACK_VERSION }}
          body: |
            单个角色独立打包，随 Characters 内容更新自动覆盖。

            - 版本: V${{ env.SINGLE_PACK_VERSION }}
            - 更新 commit: ${{ github.sha }}
            - 更新时间: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          files: packs/*.zip
          overwrite: true
