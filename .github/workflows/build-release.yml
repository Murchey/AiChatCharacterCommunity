name: Build & Release Character Packs

# push 到 main 且 Characters 相关文件变化时自动打包发布；也可手动触发
on:
  push:
    branches: [main]
    paths:
      - 'Characters/**'
      - 'scripts/build-packs.sh'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 两个 release 的固定版本号（tag 与 release 名称一致；升版本/改名改这里）
  GAME_PACK_VERSION: "1.0.0"
  SINGLE_PACK_VERSION: "1.1.0"

jobs:
  build:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 运行打包脚本
        run: bash scripts/build-packs.sh

      - name: 上传游戏包产物
        uses: actions/upload-artifact@v5
        with:
          name: game-packs
          path: dist/game/*.zip
          if-no-files-found: error

      - name: 上传角色包产物
        uses: actions/upload-artifact@v5
        with:
          name: single-packs
          path: dist/single/*.zip
          if-no-files-found: error

  release-game:
    name: 发布游戏分类角色包
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载游戏包产物
        uses: actions/download-artifact@v5
        with:
          name: game-packs
          path: packs

      - name: 发布 Release（覆盖更新同名 V${{ env.GAME_PACK_VERSION }}）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 诊断：确认待上传文件存在
          ls -la packs/
          # 删除同名旧 release（连带清理 tag）
          gh release delete "V${{ env.GAME_PACK_VERSION }}" --yes --cleanup-tag 2>/dev/null || true
          # 兜底：若仅剩孤立 tag（无 release），强制删除，避免 create 报 tag 已存在
          gh api "repos/${{ github.repository }}/git/refs/tags/V${{ env.GAME_PACK_VERSION }}" -X DELETE 2>/dev/null || true
          # 创建 release（tag 不存在时自动创建）
          gh release create "V${{ env.GAME_PACK_VERSION }}" packs/*.zip \
            --title "游戏分类角色包 V${{ env.GAME_PACK_VERSION }}" \
            --target "${{ github.sha }}" \
            --notes "按游戏分类的角色包，随 Characters 内容更新自动覆盖。更新 commit: ${{ github.sha }}"

  release-single:
    name: 发布角色分类角色包
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载角色包产物
        uses: actions/download-artifact@v5
        with:
          name: single-packs
          path: packs

      - name: 发布 Release（覆盖更新同名 V${{ env.SINGLE_PACK_VERSION }}）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 诊断：确认待上传文件存在
          ls -la packs/
          # 删除同名旧 release（连带清理 tag）
          gh release delete "V${{ env.SINGLE_PACK_VERSION }}" --yes --cleanup-tag 2>/dev/null || true
          # 兜底：若仅剩孤立 tag（无 release），强制删除，避免 create 报 tag 已存在
          gh api "repos/${{ github.repository }}/git/refs/tags/V${{ env.SINGLE_PACK_VERSION }}" -X DELETE 2>/dev/null || true
          # 创建 release（tag 不存在时自动创建）
          gh release create "V${{ env.SINGLE_PACK_VERSION }}" packs/*.zip \
            --title "角色分类角色包 V${{ env.SINGLE_PACK_VERSION }}" \
            --target "${{ github.sha }}" \
            --notes "单个角色独立打包，随 Characters 内容更新自动覆盖。更新 commit: ${{ github.sha }}"
